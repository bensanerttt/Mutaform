[package]
name = "mutaform"
version = "2.1.0"
edition = "2021"
authors = ["Bendik Sandvold-Ertsås"]
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["assert_process_allocs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }

[build-dependencies]
cc = "1.2"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
opt-level = 3

[features]
standalone = ["nih_plug/standalone"]

[[bin]]
name = "mutaform_standalone"
path = "src/main.rs"
required-features = ["standalone"]
