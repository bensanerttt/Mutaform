# Builds Mutaform for macOS (universal) and Windows on every push, and on demand
# (Actions tab -> "Build Mutaform" -> Run workflow). Download the results under "Artifacts".
name: Build Mutaform

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Get Rubber Band source (if not included)
        shell: bash
        run: |
          if [ ! -f third_party/rubberband/single/RubberBandSingle.cpp ]; then
            mkdir -p third_party/rubberband && cd third_party/rubberband
            git init -q && git remote add origin https://github.com/breakfastquay/rubberband.git
            git fetch -q --depth 1 origin e4296ac80b1170018a110bc326fd0d45a0eb27d6 && git checkout -q FETCH_HEAD
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build universal VST3 + CLAP
        run: bash ./scripts/build-macos.sh
      - name: Zip (keeps bundle structure and permissions)
        run: cd dist/macos && ditto -c -k --keepParent . ../Mutaform-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mutaform-macOS
          path: dist/Mutaform-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get Rubber Band source (if not included)
        shell: bash
        run: |
          if [ ! -f third_party/rubberband/single/RubberBandSingle.cpp ]; then
            mkdir -p third_party/rubberband && cd third_party/rubberband
            git init -q && git remote add origin https://github.com/breakfastquay/rubberband.git
            git fetch -q --depth 1 origin e4296ac80b1170018a110bc326fd0d45a0eb27d6 && git checkout -q FETCH_HEAD
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --lib
      - name: Bundle
        shell: bash
        run: |
          mkdir -p dist/windows/Mutaform.vst3/Contents/x86_64-win
          cp target/release/mutaform.dll dist/windows/Mutaform.vst3/Contents/x86_64-win/Mutaform.vst3
          cp target/release/mutaform.dll dist/windows/Mutaform.clap
      - uses: actions/upload-artifact@v4
        with:
          name: Mutaform-Windows
          path: dist/windows
